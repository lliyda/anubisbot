<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>查地址 · anubisbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/address.css" />
</head>
<body class="addr-page">
  <header class="addr-page-head">
    <h1>查地址</h1>
    <div class="addr-dlg-tools">
      <input id="addrQueryInput" class="mono" placeholder="输入 0x 开头的钱包地址" spellcheck="false" />
      <button type="button" class="addr-copy-btn" id="btnAddrCopy" title="复制" aria-label="复制"><svg class="addr-copy-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="2" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button type="button" class="btn primary sm" id="btnAddrQuery">查询</button>
      <button type="button" class="btn secondary sm" id="btnAddrRefresh">刷新</button>
      <a id="addrExplorerLink" href="#" target="_blank" rel="noreferrer" hidden>区块浏览器 ↗</a>
    </div>
  </header>
  <main class="addr-page-body" id="addrDlgBody"></main>
  <script src="/address.js"></script>
</body>
</html>
